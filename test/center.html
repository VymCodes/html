<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .grid-container{
            display:grid;
            grid-template-columns: repeat(2,220px);
            gap: 15px;
        }
        .grid-container img{
            border-radius: 10px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="grid-container">
    <img src="https://picsum.photos/id/1015/250/180" alt="Image 1">
    <img src="https://picsum.photos/id/1025/250/180" alt="Image 2">
    <img src="https://picsum.photos/id/1035/250/180" alt="Image 3">
    <img src="https://picsum.photos/id/1045/250/180" alt="Image 4">
  </div>
</body>
</html>
