<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body{
       height: 100vh; 
       display: flex;
       justify-content: center;
       align-items: center;
    }
    .photo img{
        border-radius: 10px;
    }
    .photo{
        border: 2px solid lightskyblue;
        padding: 10px 8px 15px 10px;
        text-align: center;
        margin: 15px;
    }
    .outer{
        border: 2px solid rgb(0, 74, 148);
        display: flex;
    }
    .photo2{
        padding: 10px 8px 15px 10px;
        border: 2px solid blue;
        margin: 15px;
        text-align: center;
    }
</style>
</head>
<body>
    <div class="outer">
        <div class="photo">
            <figcaption>a nice looking mountain range</figcaption><br>
            <img src="https://picsum.photos/id/1015/250/180" alt="Image 1">
        </div>
        <div class="photo2">
            <figcaption>a puppy living on the mountiain</figcaption><br>
            <img src="https://picsum.photos/id/1025/250/180" alt="Image 2">
        </div>
    </div>
</body>
</html>
