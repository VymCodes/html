<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ultra Modern Form</title>
<link rel="stylesheet" href="form_ai.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="top-bar">
        <h1>Player Details</h1>
        <div class="toggle" id="themeToggle"></div>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <form id="myForm">

        <div class="input-group">
            <input type="text" required>
            <label>Name</label>
        </div>

        <div class="input-group">
            <input type="email" required>
            <label>Email Address</label>
        </div>

        <div class="input-group">
            <input type="password" required>
            <label>Contact Number</label>
        </div>

        <div class="section-title">Gender</div>

        <div class="options radio-group">
            <label class="option">
                <input type="radio" name="gender">
                Female
            </label>

            <label class="option">
                <input type="radio" name="gender">
                Male
            </label>

            <label class="option">
                <input type="radio" name="gender">
                Tomato 🍅
            </label>
        </div>

        <div class="section-title">Favorite Players</div>

        <div class="options checkbox-group">

            <label class="option">
                <input type="checkbox">
                Mbappe
            </label>

            <label class="option">
                <input type="checkbox">
                Messi
            </label>

            <label class="option">
                <input type="checkbox">
                Ronaldo
            </label>

            <label class="option">
                <input type="checkbox">
                Vini Jr
            </label>

            <label class="option">
                <input type="checkbox">
                Yamal
            </label>

        </div>

        <button type="submit">
            Submit Form ✨
        </button>

        <div class="success" id="successMessage">
            ✅ Form Submitted Successfully!
        </div>

    </form>

</div>

<script>

/* Theme Toggle */

const toggle = document.getElementById("themeToggle");

toggle.addEventListener("click", () => {
    document.body.classList.toggle("light-mode");
});

/* Interactive Options */

document.querySelectorAll(".option").forEach(option => {

    option.addEventListener("click", () => {

        const input = option.querySelector("input");

        if(input.type === "radio"){

            document.querySelectorAll(".radio-group .option")
            .forEach(el => el.classList.remove("active"));

            option.classList.add("active");

        } else {

            option.classList.toggle("active");
        }

        updateProgress();
    });
});

/* Progress Bar */

const formInputs = document.querySelectorAll("input");
const progressBar = document.getElementById("progressBar");

function updateProgress(){

    let filled = 0;

    formInputs.forEach(input => {

        if(
            (input.type === "text" ||
             input.type === "email" ||
             input.type === "password")
             && input.value !== ''
        ){
            filled++;
        }

        if((input.type === "radio" || input.type === "checkbox") && input.checked){
            filled++;
        }

    });

    const percent = (filled / formInputs.length) * 100;
    progressBar.style.width = percent + "%";
}

formInputs.forEach(input => {
    input.addEventListener("input", updateProgress);
});

/* Submit Animation */

const form = document.getElementById("myForm");
const success = document.getElementById("successMessage");

form.addEventListener("submit", function(e){

    e.preventDefault();

    success.style.display = "block";

    setTimeout(() => {
        success.style.display = "none";
    },3000);

});

</script>

</body>
</html>
