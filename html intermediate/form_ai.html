<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ultra Modern Form</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg1:#0f172a;
    --bg2:#1e293b;
    --card:rgba(255,255,255,0.08);
    --text:#ffffff;
    --accent:#38bdf8;
    --accent2:#8b5cf6;
}

.light-mode{
    --bg1:#f1f5f9;
    --bg2:#dbeafe;
    --card:rgba(255,255,255,0.7);
    --text:#111827;
    --accent:#2563eb;
    --accent2:#7c3aed;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    overflow:hidden;
    transition:0.5s;
    padding:20px;
}

/* Glow Effects */
body::before,
body::after{
    content:'';
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.4;
}

body::before{
    width:320px;
    height:320px;
    background:var(--accent);
    top:-100px;
    left:-100px;
}

body::after{
    width:320px;
    height:320px;
    background:var(--accent2);
    bottom:-100px;
    right:-100px;
}

.container{
    position:relative;
    z-index:2;
    width:420px;
    padding:35px;
    border-radius:28px;
    background:var(--card);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 10px 40px rgba(0,0,0,0.25);
    color:var(--text);
    animation:slideUp 1s ease;
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

h1{
    font-size:28px;
    font-weight:700;
}

/* Theme Toggle */

.toggle{
    width:55px;
    height:30px;
    background:rgba(255,255,255,0.15);
    border-radius:50px;
    cursor:pointer;
    position:relative;
    transition:0.3s;
}

.toggle::before{
    content:'';
    position:absolute;
    width:22px;
    height:22px;
    background:white;
    border-radius:50%;
    top:4px;
    left:4px;
    transition:0.3s;
}

.light-mode .toggle::before{
    transform:translateX(25px);
}

/* Progress Bar */

.progress{
    width:100%;
    height:8px;
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:28px;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:0.3s;
}

/* Floating Inputs */

.input-group{
    position:relative;
    margin-bottom:24px;
}

.input-group input{
    width:100%;
    padding:18px 14px 10px;
    border:none;
    outline:none;
    border-radius:16px;
    background:rgba(255,255,255,0.08);
    color:var(--text);
    font-size:15px;
    transition:0.3s;
}

.input-group label{
    position:absolute;
    left:14px;
    top:16px;
    color:rgba(255,255,255,0.65);
    pointer-events:none;
    transition:0.3s;
}

.light-mode .input-group label{
    color:#555;
}

.input-group input:focus,
.input-group input:valid{
    background:rgba(255,255,255,0.15);
    transform:scale(1.02);
}

.input-group input:focus + label,
.input-group input:valid + label{
    top:6px;
    font-size:11px;
    color:var(--accent);
}

/* Options */

.section-title{
    margin-bottom:10px;
    font-size:14px;
    opacity:.9;
}

.options{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
}

.option{
    padding:12px 16px;
    border-radius:14px;
    background:rgba(255,255,255,0.08);
    cursor:pointer;
    transition:0.3s;
    user-select:none;
}

.option:hover{
    transform:translateY(-3px);
    background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.option input{
    display:none;
}

.option.active{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 5px 20px rgba(56,189,248,0.35);
}

/* Button */

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(56,189,248,0.35);
}

/* Success Message */

.success{
    margin-top:18px;
    text-align:center;
    color:#4ade80;
    display:none;
    font-weight:600;
    animation:pop 0.5s ease;
}

@keyframes pop{
    0%{
        transform:scale(0.8);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <h1>Player Details</h1>
        <div class="toggle" id="themeToggle"></div>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <form id="myForm">

        <div class="input-group">
            <input type="text" required>
            <label>Name</label>
        </div>

        <div class="input-group">
            <input type="email" required>
            <label>Email Address</label>
        </div>

        <div class="input-group">
            <input type="password" required>
            <label>Contact Number</label>
        </div>

        <div class="section-title">Gender</div>

        <div class="options radio-group">
            <label class="option">
                <input type="radio" name="gender">
                Female
            </label>

            <label class="option">
                <input type="radio" name="gender">
                Male
            </label>

            <label class="option">
                <input type="radio" name="gender">
                Tomato 🍅
            </label>
        </div>

        <div class="section-title">Favorite Players</div>

        <div class="options checkbox-group">

            <label class="option">
                <input type="checkbox">
                Mbappe
            </label>

            <label class="option">
                <input type="checkbox">
                Messi
            </label>

            <label class="option">
                <input type="checkbox">
                Ronaldo
            </label>

            <label class="option">
                <input type="checkbox">
                Vini Jr
            </label>

            <label class="option">
                <input type="checkbox">
                Yamal
            </label>

        </div>

        <button type="submit">
            Submit Form ✨
        </button>

        <div class="success" id="successMessage">
            ✅ Form Submitted Successfully!
        </div>

    </form>

</div>

<script>

/* Theme Toggle */

const toggle = document.getElementById("themeToggle");

toggle.addEventListener("click", () => {
    document.body.classList.toggle("light-mode");
});

/* Interactive Options */

document.querySelectorAll(".option").forEach(option => {

    option.addEventListener("click", () => {

        const input = option.querySelector("input");

        if(input.type === "radio"){

            document.querySelectorAll(".radio-group .option")
            .forEach(el => el.classList.remove("active"));

            option.classList.add("active");

        } else {

            option.classList.toggle("active");
        }

        updateProgress();
    });
});

/* Progress Bar */

const formInputs = document.querySelectorAll("input");
const progressBar = document.getElementById("progressBar");

function updateProgress(){

    let filled = 0;

    formInputs.forEach(input => {

        if(
            (input.type === "text" ||
             input.type === "email" ||
             input.type === "password")
             && input.value !== ''
        ){
            filled++;
        }

        if((input.type === "radio" || input.type === "checkbox") && input.checked){
            filled++;
        }

    });

    const percent = (filled / formInputs.length) * 100;
    progressBar.style.width = percent + "%";
}

formInputs.forEach(input => {
    input.addEventListener("input", updateProgress);
});

/* Submit Animation */

const form = document.getElementById("myForm");
const success = document.getElementById("successMessage");

form.addEventListener("submit", function(e){

    e.preventDefault();

    success.style.display = "block";

    setTimeout(() => {
        success.style.display = "none";
    },3000);

});

</script>

</body>
</html>
