<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: rgb(98, 174, 240);
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #005cfb;
        }

        #zoo {
            border: epx solid #1d6df6;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 6px;
            text-align:left;
        }

        .zone {
            border: 1px solid #1d6df6;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: left;
        }

        button {
            background: #1d6df6;
            color: aliceblue;
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My zoo</h1>
    <p>Use JavaScript and the DOM to add animals to each cage!</p>

    <div id="zoo">
        <div class="zone">Zone 1: <span id="zone1"></span></div>
        <div class="zone">Zone 2: <span id="zone2"></span></div>
        <div class="zone">Zone 3: <span id="zone3"></span></div>
        <div class="zone">Total Animals: <span id="total"></span></div>
    </div>

    <br>

    <button onclick="openZoo()">Open the Zoo!</button>

    <p id="zoo-status"></p>

    <script>

        function openZoo() {

            document.getElementById("zone1").innerHTML = "Lion";
            document.getElementById("zone2").innerHTML = "Elephant";
            document.getElementById("zone3").innerHTML = "Penquin";
            document.getElementById("total").innerHTML = "3";
            document.getElementById("zoo").innerHTML = lightgreen;
            document.getElementById("zoo-status").innerHTML = document.title + "is now open!";
        }
    </script>
</body>
</html>
