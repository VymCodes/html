<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <p>A function can access variables defined inside the funtion:</p>
    <div class="buttongroup">
        <button class="bt" type="button" onclick="myFunction()">Vyoms Button </button>
        <button class="bt" type="button" onclick="yourFunction()">Vyoms Other Button </button>
        <button class="bt" type="button" onclick="ourFunction()">Vyoms third Button </button>
    </div>
    <p id="demo"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <script>
        var b = 5;
        function myFunction() {
        var a =4;
        document.getElementById("demo").innerHTML = b / a;
        document.getElementById("demo2").innerHTML = ""
        document.getElementById("demo3").innerHTML = ""
        }


        var b = 5;
        function yourFunction() {
        var a = 4;
        document.getElementById("demo2").innerHTML = b * a;
        document.getElementById("demo").innerHTML = ""
        document.getElementById("demo3").innerHTML = ""
        }


        var b = 5;
        function ourFunction() {
        var a = 4;
        document.getElementById("demo3").innerHTML = b ** a;
        document.getElementById("demo").innerHTML = ""
        document.getElementById("demo2").innerHTML = ""
        }
    </script>
</body>
</html>
