<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link

href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"

rel="stylesheet">
</head>
<body>
    <div class="container">

        <h1 class="mb-2">My Phone Contact</h1>
        <p class="text-muted mb-4">
            Introduction to Objects in JavaScript - Grade 4-6
        </p>

        <div class="card shadow-sm mb-3" style="max-width: 400px;">
            <div class="card-body">
                <h5 class="card-title" style="color: #FF5A43;">Contact Details</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <span class="card-labal d-block">Name</span>
                        <strong id="name">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-labal d-block">Phone</span>
                        <strong id="phone">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-labal d-block">School</span>
                        <strong id="school">-</strong>
                    </li>
                    
                    <li class="list-group-item">
                        <span class="card-labal d-block">City</span>
                        <strong id="city">-</strong>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="card shadow-sm" style="max-width: 400px;">
        <div class="card-body">
            <h6 style="color: #FF5A43;">JavaScript Object Used</h6>
            <pre id="codeDisplay"
                class="bg-light p-3 rounded border mb-0"></pre>
        </div>
    </div>

    <script>
        var myContact = {
            name:   "vyom",
            phone:  "+1 234 567 8900",
            school: "very smart school that is smart",
            city:   "Mars"
        };

        var nameEl = document.getElementById("name");
        var phoneEl = document.getElementById("phone");
        nameEl.textContent = myContact.name;
        phoneEl.textContent = myContact.phone;

        var schoolEl = document.getElementById("school");
        var cityEl = document.getElementById("city");
        schoolEl.textContent = myContact["school"];
        cityEl.textContent = myContact["city"];

        var codeEl = document.getElementById("codeDisplay");
        codeEl.textContent =
            'var myContact = {\n' +
            ' name: "' + myContact.name + '",\n' +
            ' phone: "' + myContact.phone + '",\n' +
            ' school: "' + myContact.["school"] + '",\n' +
            ' city: "' + myContact.["city"] + '",\n' +
            '};';
    </script>

</body>
</html>
