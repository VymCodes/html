<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<button onclick="myfunction(5)">Execute JS function</button>
<button onclick="yourfunction(3,8)">Vyoms cool button</button>

<script>
function myfunction(x,y)
{
    if (y== undefined) {
        y=2;
    }
    document.write(x*y);
}

function yourfunction(x,y)
{
    if (x>0 && y>0) {
        document.write(x+y);
    }
    else {
        document.write(x-y);
    }
}
</script>
</body>
</html>
