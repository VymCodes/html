<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Array Methods</h2>
    <h2>join() and pop()</h2>
    <p>The join() method joins array elements into a string and the pop() method removes the last element from an array</p>
    <p id="myjoin"></p>
    <p id="myfirstpop"></p>
    <p id="mysecondpop"></p>
    <p id="myfirstshift"></p>
    <p id="myfirstpush"></p>
    <p id="om"></p>

    <script>
        var fruits = ["Banana", "Orange", "Apple", "Mango"];
        document.getElementById("myjoin").innerHTML = fruits.join(" * ");
        document.getElementById("myfirstpop").innerHTML = fruits;
        fruits.pop();
        document.getElementById("mysecondpop").innerHTML = fruits;
        fruits.shift()
        document.getElementById("myfirstshift").innerHTML = fruits;
        fruits.push(" vyom is so cool hahahahah ")
        document.getElementById("myfirstpush").innerHTML = fruits;
        
        var my_para =  document.getElementById("om");
        my_para.textContent = "";

        fruits.forEach((fruit,index) =>{
            console.log(`Item at index ${index} is ${fruit}`);
            my_para.textContent+=fruit;
        });

    </script>
</body>
</html>
