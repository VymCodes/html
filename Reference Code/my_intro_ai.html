<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyom's Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            width: 320px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            padding: 20px;
        }

        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0;
            color: #333;
        }

        .info {
            text-align: left;
            margin-top: 15px;
        }

        .info p {
            margin: 8px 0;
            font-size: 16px;
        }

        .highlight {
            background: yellow;
            padding: 2px 5px;
            border-radius: 5px;
        }

        .footer {
            margin-top: 15px;
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://m.media-amazon.com/images/I/610j4YuNjiL.jpg" alt="Rubik's Cube">

        <h1>Hi, I'm Vyom 👋</h1>

        <div class="info">
            <p><strong>Age:</strong> 12</p>
            <p><strong>Location:</strong> Massachusetts, USA</p>
            <p><strong>Favorite Subject:</strong> <span class="highlight">Math</span></p>
            <p><strong>Hobbies:</strong> <span class="highlight">Cubing</span> & <span class="highlight">Soccer</span></p>
        </div>

        <div class="footer">
            Future coder in the making 🚀
        </div>
    </div>

</body>
</html>
