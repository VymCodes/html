<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Vyom's Ice Cream Shop</title> 
  <style> 
    /* Base Page Styling */
    body { 
      background-color: rgb(231, 204, 172); 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #4a3728; /* Dark brown text matches the ice cream theme */
      margin: 0;
      padding: 40px 20px;
    } 

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 5px;
      color: #2c1d11;
    }

    hr {
      border: 0;
      height: 1px;
      background-image: linear-gradient(to right, transparent, #b89774, transparent);
      margin: 30px 0;
    }

    /* Container Box Styling */
    .flavors, .workers { 
      background-color: rgb(245, 203, 114); 
      text-align: center; 
      border-radius: 20px; 
      padding: 25px; 
      max-width: 400px; 
      margin: 20px auto; 
      
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1); 
      
      transition: transform 0.3s ease, box-shadow 0.3s ease; 
    } 




    h2 {
      margin-top: 0;
      color: #2c1d11;
      border-bottom: 2px solid rgba(0,0,0,0.05);
      padding-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      margin: 12px 0;
      font-weight: 500;
    }

    
    mark {
      background-color: #f50d0d; 
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
  </style> 
</head> 
<body> 

  <h1>Vyom's Ice Cream Shop</h1>
  <hr> 

  <!-- Flavors Section -->
  <div class="flavors"> 
    <h2>Flavors:</h2> 
    <p>Chocolate chip</p> 
    <p>Double Chocolate</p> 
    <p>Tomato chip</p> 
    <p>Mint chip</p> 
    <p>Vyom's special <mark>(out of stock)</mark></p> 
  </div> 

  <hr> 

  <!-- Workers Section -->
  <div class="workers"> 
    <h2>Workers</h2> 
    <p>Vyom (Owner)</p>
    <p>ahaan (Scooper)</p>
  </div> 
</body> 
</html>
