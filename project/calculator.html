<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="calculator">

        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="bt" type="button" onclick="clearDisplay()">C</button>
            <button class="bt" type="button" onclick="appendOperator('/')">/</button>
            <button class="bt" type="button" onclick="appendOperator('*')">*</button>
            <button class="bt" type="button" onclick="appendOperator('-')">-</button>
            

            <button class="bt" type="button" onclick="appendOperator('7')">7</button>
            <button class="bt" type="button" onclick="appendOperator('8')">8</button>
            <button class="bt" type="button" onclick="appendOperator('9')">9</button>
            <button class="bt" type="button" onclick="appendOperator('+')">+</button>


            <button class="bt" type="button" onclick="appendOperator('4')">4</button>
            <button class="bt" type="button" onclick="appendOperator('5')">5</button>
            <button class="bt" type="button" onclick="appendOperator('6')">6</button>
            <button class="bt" type="button" onclick="calculate()">=</button>


            <button class="bt" type="button" onclick="appendOperator('1')">1</button>
            <button class="bt" type="button" onclick="appendOperator('2')">2</button>
            <button class="bt" type="button" onclick="appendOperator('3')">3</button>
            <button class="bt" type="button" onclick="appendOperator('0')">0</button>
        
        </div>
    </div>
</body>
</html>
